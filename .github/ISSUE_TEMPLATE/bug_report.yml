name: Bug report
description: Report a reproducible problem with iMusic.
body:
  - type: markdown
    attributes:
      value: >-
        For vulnerabilities, use private reporting under the Security tab.
        Remove private paths, pairing codes, and library details from attachments.
        Do not upload copyrighted music.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Device, OS version, Xcode version if relevant, and app commit.
      placeholder: iPhone / iPad / Mac, OS version, commit
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: For audio problems, include the format, output route, and whether LLDB is attached.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized logs or screenshots if they help explain the problem.
    validations:
      required: true
